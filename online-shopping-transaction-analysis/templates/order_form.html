{% extends "base.html" %}{% block content %}<h1>Create order</h1>{% if not products %}<p>Add a product first from Products.</p>{% else %}<form method="post" class="panel">
<label>Date/time<input type="datetime-local" name="order_date" value="{{now}}"></label><label>Payment<select name="payment">{% for p in payments %}<option>{{p}}</option>{% endfor %}</select></label><label>Status<select name="status">{% for s in statuses %}<option {% if s=="Completed" %}selected{% endif %}>{{s}}</option>{% endfor %}</select></label><h2>Items (up to 3 lines)</h2>
{% for i in range(3) %}<div class="line"><label>Product<select name="product_id"><option value="">Choose</option>{% for p in products %}<option value="{{p.product_id}}">{{p.product_name}} — ₹{{p.unit_price}}</option>{% endfor %}</select></label><label>Quantity<input name="quantity" type="number" min="1"></label></div>{% endfor %}<button class="btn">Save order</button></form>{% endif %}{% endblock %}
