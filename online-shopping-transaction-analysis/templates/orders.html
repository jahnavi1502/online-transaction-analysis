{% extends "base.html" %}{% block content %}<h1>Orders</h1><p><a class="btn" href="/orders/new">Create order</a></p><div class="panel"><table><tr><th>Order</th><th>Date</th><th>Units</th><th>Payment</th><th>Status</th><th>Total</th></tr>{% for o in orders %}<tr><td>#{{o.order_id}}</td><td>{{o.order_date}}</td><td>{{o.units}}</td><td>{{o.payment_method}}</td><td>{{o.order_status}}</td><td>{{o.total|money}}</td></tr>{% else %}<tr><td colspan="6">No orders yet.</td></tr>{% endfor %}</table></div>{% endblock %}
