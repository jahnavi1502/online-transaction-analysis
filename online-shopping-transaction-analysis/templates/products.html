{% extends "base.html" %}{% block content %}<h1>Products</h1><p><a class="btn" href="/products/new">Add product</a></p><div class="panel"><table><tr><th>ID</th><th>Product</th><th>Category</th><th>Price</th></tr>{% for p in products %}<tr><td>{{p.product_id}}</td><td>{{p.product_name}}</td><td>{{p.category}}</td><td>{{p.unit_price|money}}</td></tr>{% else %}<tr><td colspan="4">No products.</td></tr>{% endfor %}</table></div>{% endblock %}
